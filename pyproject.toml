[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.1.0"
description = "Systematic alpha research framework focused on signal discovery, validation, and robustness."
requires-python = ">=3.11"
authors = [
    {name = "Marcos Vinicius M. Sylverio"}
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "polars>=1.0.0",
    "statsmodels>=0.14.0",
    "pyarrow>=14.0.0",
    "python-dateutil>=2.9.0"
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.0"]
viz = ["matplotlib>=3.8.0"]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["alpha_research*"]
